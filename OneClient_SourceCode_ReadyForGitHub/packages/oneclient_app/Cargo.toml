[package]
name = "oneclient_app"
description = "PulseClient Freya App"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
readme = { workspace = true }
homepage = { workspace = true }
authors = { workspace = true }

[features]
default = []

[dependencies]
oneclient_auth.workspace = true
oneclient_cluster.workspace = true
oneclient_common.workspace = true
oneclient_content.workspace = true
oneclient_events.workspace = true
oneclient_java.workspace = true
oneclient_mc.workspace = true
oneclient_polyplus.workspace = true
oneclient_net.workspace = true
oneclient_core.workspace = true
oneclient_db.workspace = true
chrono.workspace = true
oneclient_macro = { workspace = true, features = ["freya"] }

polyio.workspace = true
rust-embed.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
uuid.workspace = true
bytes.workspace = true
sysinfo.workspace = true

notify.workspace = true

anyhow.workspace = true
regex.workspace = true

cargo-packager-updater = "=0.2.3"

rfd = "=0.17.2"
open = "=5.4.0"

# clipboard image copy + decode for it
arboard.workspace = true
image.workspace = true

freya-skia-safe.workspace = true
freya.workspace = true
reqwest.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = "=0.1.52"

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"

[package.metadata.packager]
product-name = "PulseClient"
identifier = "org.polyfrost.PulseClient"
category = "Game"
publisher = "Polyfrost Inc."
copyright = "© 2026 Polyfrost Inc."
homepage = "https://polyfrost.org/projects/PulseClient"
long-description = "Next-generation open source Minecraft launcher"
formats = ["nsis", "app", "dmg", "deb", "appimage"]
binaries = [{ path = "oneclient_app", main = true }]
icons = [
  "icons/32x32.png",
  "icons/64x64.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]
resources = [
  { src = "icons/generated/Assets.car", target = "Assets.car" },
  # >>> CRT_RESOURCES >>>
  # Generated by distribution/windows/bundle-crt.py -- do not edit by hand.
  { src = "C:\\Users\\ASUS\\Desktop\\OneLauncher-main\\target\\crt\\concrt140.dll", target = "concrt140.dll" },
  { src = "C:\\Users\\ASUS\\Desktop\\OneLauncher-main\\target\\crt\\msvcp140.dll", target = "msvcp140.dll" },
  { src = "C:\\Users\\ASUS\\Desktop\\OneLauncher-main\\target\\crt\\msvcp140_1.dll", target = "msvcp140_1.dll" },
  { src = "C:\\Users\\ASUS\\Desktop\\OneLauncher-main\\target\\crt\\msvcp140_2.dll", target = "msvcp140_2.dll" },
  { src = "C:\\Users\\ASUS\\Desktop\\OneLauncher-main\\target\\crt\\msvcp140_atomic_wait.dll", target = "msvcp140_atomic_wait.dll" },
  { src = "C:\\Users\\ASUS\\Desktop\\OneLauncher-main\\target\\crt\\msvcp140_codecvt_ids.dll", target = "msvcp140_codecvt_ids.dll" },
  { src = "C:\\Users\\ASUS\\Desktop\\OneLauncher-main\\target\\crt\\vccorlib140.dll", target = "vccorlib140.dll" },
  { src = "C:\\Users\\ASUS\\Desktop\\OneLauncher-main\\target\\crt\\vcruntime140.dll", target = "vcruntime140.dll" },
  { src = "C:\\Users\\ASUS\\Desktop\\OneLauncher-main\\target\\crt\\vcruntime140_1.dll", target = "vcruntime140_1.dll" },
  { src = "C:\\Users\\ASUS\\Desktop\\OneLauncher-main\\target\\crt\\vcruntime140_threads.dll", target = "vcruntime140_threads.dll" },
  # <<< CRT_RESOURCES <<<
